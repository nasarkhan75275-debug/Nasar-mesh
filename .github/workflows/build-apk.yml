name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Backup main.dart
        run: cp lib/main.dart /tmp/main.dart || echo "no main.dart yet"
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Create Android project
        run: flutter create . --org com.nasar.mesh --project-name nasar_mesh --platforms=android --no-pub
      
      - name: Restore main.dart
        run: cp /tmp/main.dart lib/main.dart
      
      - run: flutter pub get
      
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nasar-mesh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
