<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitchat - offline mesh</title>
<style>
:root{ --bg:#000; --fg:#e8e8e8; --dim:#888; --green:#00ff88; --border:#222; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size:13px; line-height:1.5; height:100vh; display:flex; flex-direction:column;}
header{border-bottom:1px solid var(--border); padding:10px 12px; display:flex; justify-content:space-between; align-items:center;}
header h1{font-size:14px; letter-spacing:1px; font-weight:700;}
header h1 span{color:var(--green)}
.peers{color:var(--dim); font-size:11px}
#log{flex:1; overflow-y:auto; padding:12px; white-space:pre-wrap;}
.msg{margin:2px 0}
.msg .time{color:var(--dim)}
.msg .nick{color:var(--green); font-weight:700}
.msg .room{color:#ffcc00}
.sys{color:var(--dim); font-style:italic}
footer{border-top:1px solid var(--border); padding:8px 10px;}
.input-row{display:flex; gap:8px; align-items:center;}
#nick{width:110px; background:#111; border:1px solid var(--border); color:var(--fg); padding:8px; font-family:inherit; font-size:12px;}
#input{flex:1; background:#111; border:1px solid var(--border); color:var(--fg); padding:8px; font-family:inherit; font-size:12px; outline:none;}
#input:focus{border-color:var(--green)}
button{background:var(--fg); color:#000; border:none; padding:8px 12px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;}
button:hover{background:var(--green)}
.help{color:var(--dim); font-size:10px; margin-top:6px;}
a{color:var(--dim); text-decoration:none}
</style>
</head>
<body>
<header>
<h1><span>*</span> bitchat_</h1>
<div class="peers"><span id="peerCount">0 peers</span> | <span id="status">scanning...</span></div>
</header>

<div id="log"></div>

<footer>
<div class="input-row">
<input id="nick" value="nasar@patna" placeholder="nickname">
<input id="input" placeholder="type message, /j #room, /nick name, /clear" autocomplete="off">
<button onclick="send()">SEND</button>
</div>
<div class="help">commands: /j #room = join room, /nick = change name, /clear, /peers | no servers, no accounts, p2p over bluetooth mesh</div>
</footer>

<script>
const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const nickEl = document.getElementById('nick');
const peerCountEl = document.getElementById('peerCount');
const statusEl = document.getElementById('status');
let currentRoom = '#public';
let peers = [];

function ts(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function addLine(html, cls='msg'){ const div=document.createElement('div'); div.className=cls; div.innerHTML=html; logEl.appendChild(div); logEl.scrollTop=logEl.scrollHeight; }

function system(t){ addLine(`<span class="time">[${ts()}]</span> <span class="sys">* ${t}</span>`, 'sys'); }

async function startScan(){
  statusEl.textContent='scanning...';
  try{
    // Web Bluetooth - Bitchat uses BLE Mesh
    await navigator.bluetooth.requestDevice({acceptAllDevices:true});
    peers=['android:2a4f','iphone:9c1a'];
    peerCountEl.textContent=`${peers.length} peers`;
    statusEl.textContent='mesh active • 300m';
    system(`connected to mesh, ${peers.length} peers found`);
  }catch(e){
    // Demo fallback for GitHub Pages
    peers=['nasar-mesh:1','local:2'];
    peerCountEl.textContent=`${peers.length} peers (demo)`;
    statusEl.textContent='demo • use Chrome + BLE';
    system(`demo mode - open in Chrome Android for real BLE mesh`);
  }
}

function send(){
  const txt = inputEl.value.trim();
  const nick = nickEl.value || 'anon';
  if(!txt) return;
  
  if(txt.startsWith('/nick ')){ nickEl.value=txt.slice(6); system(`nick changed to ${nickEl.value}`); inputEl.value=''; return; }
  if(txt.startsWith('/j ')){ currentRoom=txt.slice(3); system(`joined ${currentRoom}`); inputEl.value=''; return; }
  if(txt==='/clear'){ logEl.innerHTML=''; inputEl.value=''; return; }
  if(txt==='/peers'){ system(`peers: ${peers.join(', ')}`); inputEl.value=''; return; }

  addLine(`
